<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aegis Project Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-page">
    <main class="card popup-card">
      <div class="popup-heading">
        <div>
          <div class="eyebrow">Aegis</div>
          <h1>Project tracker</h1>
        </div>
        <span id="capture-state" class="pill">Loading</span>
      </div>
      <div id="latest" class="latest">No conversation has synced yet.</div>
      <button id="open-settings" class="primary full-width">Settings</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
